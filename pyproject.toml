[project]
name = "xenon-assistant"
version = "0.1.0"
description = "Local-first screen-aware personal assistant"
requires-python = ">=3.11"

[project.optional-dependencies]
uia = ["pywinauto>=0.6.9"]
capture = ["mss>=9", "pillow>=10"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xenon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
