[project]
name = "xenon-assistant"
version = "0.1.0"
description = "Local-first screen-aware personal assistant"
requires-python = ">=3.11"

[project.optional-dependencies]
uia = ["pywinauto>=0.6.9", "pywin32>=306"]
capture = ["mss>=9", "pillow>=10"]
orb = ["pillow>=10", "pystray>=0.19", "pywin32>=306", "pycaw>=20240316"]
voice = ["sounddevice>=0.4", "faster-whisper>=1.0", "pywin32>=306"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xenon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
