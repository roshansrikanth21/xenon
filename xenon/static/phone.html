<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04070c"><meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Xenon</title>
<style>
:root{
  --bg:#04070c; --panel:rgba(12,22,32,.72); --line:rgba(94,234,255,.22); --line-hi:rgba(94,234,255,.55);
  --fg:#e6f7fb; --dim:#7f98a3; --acc:#5eeaff; --acc-soft:rgba(94,234,255,.12); --warn:#ffb86b;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body>*{max-width:520px;margin-left:auto;margin-right:auto}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;
  padding:max(14px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(94,234,255,.10),transparent 60%),
    repeating-linear-gradient(0deg,rgba(94,234,255,.035) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(94,234,255,.035) 0 1px,transparent 1px 34px),var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font:600 13px/1 var(--mono);letter-spacing:.42em;color:var(--acc)}
.chip{font:12px/1 var(--mono);letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#5c6b73;box-shadow:none;transition:.3s}
.on .dot{background:var(--acc);box-shadow:0 0 10px var(--acc)}
/* ---- core ---- */
.core{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 4px}
.core svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spin{transform-origin:50% 50%;animation:spin 38s linear infinite}
.spin.rev{animation-duration:24s;animation-direction:reverse}
.spin.fast{animation-duration:9s}
.busy .spin{animation-duration:3s}.busy .spin.rev{animation-duration:2s}.busy .spin.fast{animation-duration:1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.off .core{filter:grayscale(1) brightness(.6)}
.center{position:absolute;inset:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.label{font:11px/1 var(--mono);letter-spacing:.3em;color:var(--dim);margin-bottom:8px}
.track{font-weight:600;font-size:16px;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.artist{color:var(--dim);font-size:13px;margin-top:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- reply ---- */
.reply{min-height:44px;margin:4px 2px 12px;font:13.5px/1.45 var(--mono);color:var(--acc);text-align:center}
.reply.err{color:var(--warn)}
.reply::before{content:"› ";opacity:.6}
/* ---- command bar ---- */
.bar{display:flex;gap:8px;margin-bottom:16px}
.bar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:12px;
  padding:13px 14px;font:15px var(--mono);outline:none;backdrop-filter:blur(8px)}
.bar input:focus{border-color:var(--line-hi);box-shadow:0 0 0 3px var(--acc-soft)}
.icon{width:48px;flex:none;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--acc)}
.icon svg{width:22px;height:22px}
.icon.live{background:var(--acc);color:#02141a;box-shadow:0 0 18px var(--acc)}
/* ---- panels ---- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;backdrop-filter:blur(8px)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc);opacity:.75}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.ptitle{font:11px/1 var(--mono);letter-spacing:.3em;color:var(--dim);margin:2px 2px 10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row+.row{margin-top:8px}
.btn{position:relative;overflow:hidden;background:rgba(94,234,255,.04);border:1px solid var(--line);color:var(--fg);
  border-radius:11px;padding:12px 6px;font:13px/1.2 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:border-color .15s,background .15s,transform .08s}
.btn svg{width:22px;height:22px;color:var(--acc)}
.btn:active{transform:scale(.97);background:var(--acc-soft);border-color:var(--line-hi)}
.btn.big{grid-column:span 3;flex-direction:row;justify-content:center;gap:10px;padding:14px}
.btn.lit{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 16px rgba(94,234,255,.18)}
.btn.lit span::after{content:" · on";color:var(--acc)}
.btn .fill{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--warn);box-shadow:0 0 8px var(--warn)}
.btn.hold svg{color:var(--warn)}
.hint{font:11px var(--mono);color:var(--dim);text-align:center;margin-top:10px;letter-spacing:.04em}
</style></head><body class="off">
<div class="top"><div class="brand">XENON</div><div class="chip" id="chip"><span class="dot"></span><span id="state">LINKING</span></div></div>

<div class="core" id="core">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5eeaff" stop-opacity=".28"/><stop offset="1" stop-color="#5eeaff" stop-opacity="0"/></radialGradient></defs>
    <circle cx="100" cy="100" r="96" fill="url(#g)" class="glow"/>
    <g class="spin"><circle cx="100" cy="100" r="94" fill="none" stroke="#5eeaff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 6"/></g>
    <g class="spin rev"><circle cx="100" cy="100" r="84" fill="none" stroke="#5eeaff" stroke-opacity=".75" stroke-width="3" stroke-dasharray="38 14 6 14" stroke-linecap="round"/></g>
    <g class="spin fast"><circle cx="100" cy="100" r="72" fill="none" stroke="#5eeaff" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="90 60"/></g>
    <circle cx="100" cy="100" r="64" fill="rgba(4,10,16,.85)" stroke="#5eeaff" stroke-opacity=".25"/>
  </svg>
  <div class="center"><div class="label" id="label">STANDING BY</div><div class="track" id="track">Xenon</div><div class="artist" id="artist"></div></div>
</div>

<div class="reply" id="reply">Ready.</div>

<form class="bar" id="bar"><input id="text" placeholder="Ask or command…" autocomplete="off" maxlength="300" enterkeyhint="send">
<button type="button" class="icon" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button class="icon" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button></form>

<div class="panel"><div class="ptitle">MEDIA</div>
  <div class="row">
    <button class="btn" data-c="previous song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>Prev</button>
    <button class="btn" id="pp" data-c="pause"><svg viewBox="0 0 24 24" fill="currentColor" id="ppi"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span id="ppl">Pause</span></button>
    <button class="btn" data-c="next song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>Next</button>
  </div>
  <div class="row">
    <button class="btn" data-c="volume down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 12h4" stroke-linecap="round"/></svg>Vol −</button>
    <button class="btn" data-c="what's playing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="18" r="3"/><path d="M11 18V5l9-2v12"/><circle cx="17" cy="15" r="3"/></svg>What's on</button>
    <button class="btn" data-c="volume up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 12h4M19 10v4" stroke-linecap="round"/></svg>Vol +</button>
  </div>
  <div class="row"><button class="btn big" data-c="play my usual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg>Play my usual</button></div>
</div>

<div class="panel"><div class="ptitle">MODES</div>
  <div class="row">
    <button class="btn" id="game" data-c="game mode on" data-off="game mode off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 14h.01"/></svg><span>Game</span></button>
    <button class="btn" id="xtreme" data-c="go xtreme" data-off="xtreme mode off"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span>Xtreme</span></button>
    <button class="btn" id="widget" data-c="turn on the music widget" data-off="turn off the music widget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg><span>Widget</span></button>
  </div>
  <div class="row"><button class="btn big" data-c="what do i listen to most"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>My music taste</button></div>
</div>

<div class="panel"><div class="ptitle">SYSTEM</div>
  <div class="row">
    <button class="btn" data-c="lock my pc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock</button>
    <button class="btn hold" data-hold="shut down my pc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg>Shut down<i class="fill"></i></button>
    <button class="btn hold" data-hold="restart my pc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>Restart<i class="fill"></i></button>
  </div>
  <div class="row"><button class="btn big" data-c="cancel shutdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8"/></svg>Cancel shutdown / restart</button></div>
  <div class="hint">Hold shut down or restart for a second. Both wait 60 s and can be cancelled.</div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const key=(location.hash.match(/k=([^&]+)/)||[])[1]||(()=>{try{return localStorage.getItem('xk')||''}catch(e){return ''}})();
if(location.hash){try{localStorage.setItem('xk',key)}catch(e){} history.replaceState(null,'',location.pathname)}
const body=document.body,reply=$('reply');let status={},typing=0;
function buzz(ms){if(navigator.vibrate)navigator.vibrate(ms||8)}
function say(text,err){clearInterval(typing);reply.className='reply'+(err?' err':'');reply.textContent='';let i=0;
  typing=setInterval(()=>{reply.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typing)},12)}
function setOnline(on,label){body.classList.toggle('on',on);body.classList.toggle('off',!on);$('state').textContent=label}
function paint(s){status=s||{};setOnline(true,'ONLINE'+(s.time?' · '+s.time:''));
  const playing=!!s.track;$('label').textContent=s.xtreme?'XTREME MODE':s.game?'GAME MODE':playing?(s.playing?'NOW PLAYING':'PAUSED'):'STANDING BY';
  $('track').textContent=s.track||'Xenon';$('artist').textContent=s.artist||'';
  $('pp').dataset.c=s.playing?'pause':'resume';$('ppl').textContent=s.playing?'Pause':'Play';
  $('ppi').innerHTML=s.playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  $('game').classList.toggle('lit',!!s.game&&!s.xtreme);$('xtreme').classList.toggle('lit',!!s.xtreme);$('widget').classList.toggle('lit',!!s.widget)}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{'X-Xenon-Key':key,'Content-Type':'application/json'}},opts||{}));
  if(r.status==401)throw 'key';if(!r.ok)throw 'off';return r.json()}
async function refresh(){if(document.hidden)return;try{paint(await api('/api/status'))}
  catch(e){setOnline(false,e=='key'?'WRONG KEY':'LAPTOP OFFLINE')}}
async function send(text){if(!text)return;buzz();body.classList.add('busy');say('…');
  try{const r=await api('/api/cmd',{method:'POST',body:JSON.stringify({text})});say(r.reply||'Done.');setTimeout(refresh,700)}
  catch(e){say(e=='key'?'This link has the wrong key. Copy a fresh one from Xenon on the laptop.':'Xenon is offline. The laptop is asleep or off.',true)}
  finally{body.classList.remove('busy')}}
document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{
  const lit=b.classList.contains('lit')&&b.dataset.off;send(lit?b.dataset.off:b.dataset.c)}));
// Hold to confirm (shut down / restart): fill over 1.1 s, release early cancels.
document.querySelectorAll('[data-hold]').forEach(b=>{let t0=0,raf=0;
  const stop=()=>{cancelAnimationFrame(raf);t0=0;b.style.setProperty('--p',0)};
  const step=now=>{const p=Math.min(1,(now-t0)/1100);b.style.setProperty('--p',p);
    if(p>=1){stop();buzz(40);send(b.dataset.hold)}else raf=requestAnimationFrame(step)};
  b.addEventListener('pointerdown',e=>{e.preventDefault();buzz(5);t0=performance.now();raf=requestAnimationFrame(step)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(t0){stop();say('Hold it a moment longer to confirm.')}}));
  b.addEventListener('contextmenu',e=>e.preventDefault())});
$('bar').addEventListener('submit',e=>{e.preventDefault();const t=$('text');send(t.value.trim());t.value='';t.blur()});
// Talk to Xenon from the phone (the browser's own speech recognition).
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('mic');
if(!SR){mic.style.display='none'}else{mic.addEventListener('click',()=>{const r=new SR();r.lang='en-IN';r.interimResults=true;
  mic.classList.add('live');buzz();say('Listening…');let final='';
  r.onresult=e=>{let t='';for(const x of e.results){t+=x[0].transcript}$('text').value=t;if(e.results[e.results.length-1].isFinal)final=t};
  r.onend=()=>{mic.classList.remove('live');$('text').value='';if(final)send(final.trim());else say('Didn’t catch that.',true)};
  r.onerror=()=>{mic.classList.remove('live')};r.start()})}
refresh();setInterval(refresh,5000);document.addEventListener('visibilitychange',refresh);
})();
</script></body></html>
